<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی حرفه‌ای تخته‌نرد | Backgammon</title>
    <link rel="stylesheet" href="style.css">
    <!-- فونت وزیرمتن برای زیبایی متن‌های فارسی -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
</head>
<body>

    <div class="game-container">
        <!-- هدر بازی و اطلاعات بازیکنان -->
        <header class="game-header">
            <div class="player-info player-white" id="player1-panel">
                <span class="indicator"></span>
                <span class="name">مهره‌های سفید (شما)</span>
                <span class="score" id="score-white">۰</span>
            </div>
            <div class="game-title">
                <h1>تخته‌نرد حرفه‌ای</h1>
                <div class="turn-indicator" id="turn-text">نوبت بازیکن سفید</div>
            </div>
            <div class="player-info player-black" id="player2-panel">
                <span class="indicator"></span>
                <span class="name">مهره‌های سیاه (حریف)</span>
                <span class="score" id="score-black">۰</span>
            </div>
        </header>

        <!-- بدنه اصلی تخته -->
        <main class="board-wrapper">
            <div class="board">
                <!-- سمت راست تخته (خانه‌های ۱ تا ۱۲) -->
                <div class="board-quadrant top-right" id="quad-top-right">
                    <!-- خانه‌ها توسط جاوااسکریپت یا به صورت ثابت اینجا قرار می‌گیرند -->
                </div>
                
                <!-- بار مرکزی (Bar) -->
                <div class="center-bar" id="center-bar">
                    <div class="bar-section white-bar" id="bar-white" title="مهره‌های سفید زده شده"></div>
                    <div class="bar-section black-bar" id="bar-black" title="مهره‌های سیاه زده شده"></div>
                </div>

                <!-- سمت چپ تخته (خانه‌های ۱۳ تا ۲۴) -->
                <div class="board-quadrant top-left" id="quad-top-left"></div>

                <div class="board-quadrant bottom-right" id="quad-bottom-right"></div>
                
                <div class="board-quadrant bottom-left" id="quad-bottom-left"></div>
            </div>

            <!-- پنل کنترل تاس‌ها و دکمه‌ها در کنار یا پایین تخته -->
            <div class="control-panel">
                <div class="dice-container">
                    <div class="dice" id="dice-1">⚀</div>
                    <div class="dice" id="dice-2">⚁</div>
                </div>
                <div class="actions">
                    <button id="roll-btn" class="btn primary-btn">پرتاب تاس</button>
                    <button id="pass-btn" class="btn secondary-btn" disabled>پایان نوبت</button>
                    <button id="reset-btn" class="btn danger-btn">شروع مجدد</button>
                </div>
            </div>
        </main>

        <!-- بخش بیرون بردن مهره‌ها (Bear-off) -->
        <footer class="bear-off-container">
            <div class="bear-off white-off" id="bear-off-white">سفید خارج شده: <span id="count-white-off">۰</span>/۱۵</div>
            <div class="bear-off black-off" id="bear-off-black">سیاه خارج شده: <span id="count-black-off">۰</span>/۱۵</div>
        </footer>
    </div>

    <!-- فایل جاوااسکریپت منطق بازی -->
    <script src="script.js"></script>
</body>
</html>
